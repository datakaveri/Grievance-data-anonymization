[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grievance-data-anonymization"
version = "1.0.0"
description = "Multi-Format PII Detection & Parallel NER Anonymization Pipeline"
readme = "README.md"
authors = [
    { name = "Datakaveri", email = "info@datakaveri.org" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.40.0,<5.0.0",
    "huggingface_hub>=0.22.0,<1.0.0",
    "accelerate>=0.26.0,<1.0.0",
    "sentencepiece>=0.1.99,<1.0.0",
    "protobuf>=3.20.2,<6.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<6.0.0",
    "spacy>=3.7.0,<4.0.0",
    "presidio-analyzer>=2.2.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "colorama>=0.4.6,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "psutil>=5.9.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<1.0.0",
    "black>=24.0.0,<25.0.0",
    "pre-commit>=3.7.0,<4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --cov=src/grievance_anonymization --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
