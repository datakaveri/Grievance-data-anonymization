name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff black

      - name: Code Formatting Check (Ruff & Black)
        run: |
          ruff check .
          black --check .

      - name: Run Test Suite with Coverage Gate
        run: |
          pytest --cov=src/grievance_anonymization --cov-report=xml --cov-fail-under=60

      - name: Build Docker Container
        run: |
          docker build -t grievance-anonymizer:test .
